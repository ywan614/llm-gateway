[project]
name = "llm-central-gateway"
version = "0.1.0"
description = "A small, extensible LiteLLM gateway control plane"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "psycopg[binary,pool]>=3.3.4",
    "sqlalchemy[asyncio]>=2.0.52",
    "uvicorn[standard]>=0.52.3",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
gateway-api = "llm_central_gateway.app:run"
gateway-compose = "llm_central_gateway.compose_cli:main"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["llm_central_gateway"]
