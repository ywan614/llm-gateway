[application]
APP_NAME=llm-central-gateway
ENVIRONMENT=development
HOST=127.0.0.1
PORT=8000
ADMIN_API_TOKEN=replace-with-a-random-token

[openai]
# DashScope uses an OpenAI-compatible API. Keep the provider key local.
OPENAI_API_KEY=replace-with-your-dashscope-key

[postgres]
POSTGRES_URI=postgresql://gateway_user:replace-me@localhost:5432/llm_gateway_business

[redis]
REDIS_URI=redis://redis:6379/0

[litellm]
LITELLM_ADMIN_URL=http://litellm:4000
LITELLM_DATABASE_NAME=llm_gateway_litellm
LITELLM_MASTER_KEY=replace-with-a-random-master-key
LITELLM_SALT_KEY=replace-with-a-stable-random-salt

[model]
PUBLIC_MODEL_NAME=qwen-plus
MODEL_NAME=qwen3.7-plus
MODEL_BASE_URL=https://dashscope.aliyuncs.com/compatible-mode/v1
MODEL_TIMEOUT_SECONDS=120
MODEL_MAX_RETRIES=1

[limits]
DEFAULT_RPM=60
DEFAULT_TPM=100000
DEFAULT_MAX_PARALLEL_REQUESTS=10

[logging]
LOG_DIR=logs
LOG_FILE_NAME=gateway.jsonl
LOG_LEVEL=INFO
LOG_MAX_BYTES=10485760
LOG_BACKUP_COUNT=5
LOG_VALUE_MAX_LENGTH=20000
LOG_CONSOLE=true
LOG_INCLUDE_PAYLOADS=false
